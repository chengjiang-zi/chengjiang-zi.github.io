<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>澄江子 · 作品集</title>
<meta name="description" content="游戏系统与数值设计方向的作品集。">
<meta property="og:title" content="澄江子 · 作品集">
<meta property="og:description" content="游戏系统与数值设计方向的作品集。">
<meta property="og:type" content="website">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="wrap masthead" id="masthead"></header>

<main class="wrap" id="works"></main>

<footer class="wrap">
  <div class="row">
    <a href="https://github.com/chengjiang-zi" target="_blank" rel="noopener">GitHub</a>
  </div>
  <p>本站展示的作品均为个人技术练习，与所参考的任何商业产品无关，不用于商业用途，也不提供下载与商业服务。</p>
</footer>

<noscript>
  <p style="max-width:960px;margin:0 auto;padding:0 24px 60px;color:#9aa3b2;">
    本站的作品内容由 JavaScript 渲染，请开启后再刷新。
  </p>
</noscript>

<script src="works.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function isExternal(u) {
    return String(u || "").indexOf("http") === 0;
  }

  function anchor(label, url, cls) {
    var attr = isExternal(url) ? ' target="_blank" rel="noopener"' : "";
    return '<a' + (cls ? ' class="' + cls + '"' : "") + ' href="' + esc(url) + '"' + attr + '>' + esc(label) + "</a>";
  }

  function renderMasthead() {
    var p = PROFILE, h = "";
    h += "<h1>" + esc(p.name) + "</h1>";
    if (p.realName) h += '<div class="real">' + esc(p.realName) + "</div>";
    if (p.tagline) h += '<div class="tagline">' + esc(p.tagline) + "</div>";
    if (p.intro) h += '<p class="intro">' + esc(p.intro) + "</p>";

    var ls = (p.links || []).slice();
    if (p.contact) ls.push({ label: p.contact, url: "mailto:" + p.contact });
    if (ls.length) {
      h += '<div class="toplinks">';
      for (var i = 0; i < ls.length; i++) {
        h += anchor(ls[i].label, ls[i].url, i === 0 ? "primary" : "");
      }
      h += "</div>";
    }
    document.getElementById("masthead").innerHTML = h;
  }

  function renderShots(w) {
    var shots = w.shots || [];
    if (!shots.length) return "";
    var h = '<div class="shots">';
    for (var i = 0; i < shots.length; i++) {
      var s = shots[i];
      h += '<figure class="shot">';
      h += '<img src="' + esc(s.src) + '" alt="' + esc(s.caption || w.title) + '" loading="lazy">';
      if (s.caption) h += "<figcaption>" + esc(s.caption) + "</figcaption>";
      h += "</figure>";
    }
    return h + "</div>";
  }

  function renderText(w) {
    var h = '<div class="work-text">';

    if (w.kind || w.role) {
      h += '<div class="work-meta">';
      if (w.kind) h += '<div class="kind">' + esc(w.kind) + "</div>";
      if (w.role) h += '<div class="role">' + esc(w.role) + "</div>";
      h += "</div>";
    }

    if (w.desc) h += '<p class="work-desc">' + esc(w.desc) + "</p>";

    var hls = w.highlights || [];
    if (hls.length) {
      h += '<div class="hls">';
      for (var i = 0; i < hls.length; i++) {
        h += '<div class="hl"><h4>' + esc(hls[i].t) + "</h4>";
        h += "<p>" + esc(hls[i].d) + "</p></div>";
      }
      h += "</div>";
    }

    var st = w.stats || [];
    if (st.length) {
      h += '<div class="stats">';
      for (var j = 0; j < st.length; j++) {
        h += '<div class="stat"><b>' + esc(st[j].v) + "</b><span>" + esc(st[j].l) + "</span></div>";
      }
      h += "</div>";
    }

    var tg = w.tags || [];
    if (tg.length) {
      h += '<div class="tags">';
      for (var k = 0; k < tg.length; k++) h += '<span class="tag">' + esc(tg[k]) + "</span>";
      h += "</div>";
    }

    var lk = w.links || [];
    if (lk.length) {
      h += '<div class="links">';
      for (var m = 0; m < lk.length; m++) h += anchor(lk[m].label, lk[m].url, m === 0 ? "primary" : "");
      h += "</div>";
    }

    return h + "</div>";
  }

  function renderWork(w) {
    var h = '<article class="work" id="' + esc(w.id) + '">';
    h += '<div class="work-head">';
    h += "<h2>" + esc(w.title) + "</h2>";
    if (w.en) h += '<span class="en">' + esc(w.en) + "</span>";
    if (w.status === "wip") h += '<span class="badge">进行中</span>';
    if (w.year) h += '<span class="year">' + esc(w.year) + "</span>";
    h += "</div>";
    h += '<div class="work-body">' + renderShots(w) + renderText(w) + "</div>";
    return h + "</article>";
  }

  renderMasthead();
  document.getElementById("works").innerHTML = WORKS.map(renderWork).join("");
})();
</script>

</body>
</html>
