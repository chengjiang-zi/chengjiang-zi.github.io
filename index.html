<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>
(function () {
  var d = document.documentElement;
  d.classList.add("booting");
  addEventListener("error", function () { d.classList.remove("booting"); });
  setTimeout(function () { d.classList.remove("booting"); }, 6000);
})();
</script>
<title>澄江子的作品集</title>
<meta name="description" content="自己做游戏，做了四个项目。">
<link rel="canonical" href="https://chengjiang-zi.github.io/">

<meta property="og:type" content="website">
<meta property="og:site_name" content="澄江子">
<meta property="og:locale" content="zh_CN">
<meta property="og:url" content="https://chengjiang-zi.github.io/">
<meta property="og:title" content="澄江子的作品集">
<meta property="og:description" content="自己做游戏，做了四个项目。">

<script src="ink.js" defer></script>
<noscript><style>.topbar nav,.cover,#works,#skills,#cases,.pad,.progress,.scribble,footer{display:none}</style></noscript>
<script>
(function () {
  var d = document.documentElement;
  if (typeof IntersectionObserver !== "function") return;
  try { if (matchMedia("(prefers-reduced-motion: reduce)").matches) return; } catch (e) {}
  d.classList.add("motion-ready");
  setTimeout(function () {
    var hero = document.querySelector("[data-reveal-text]");
    if (!document.querySelector(".is-revealed") || (hero && !hero.classList.contains("is-revealed"))) {
      d.classList.remove("motion-ready");
    }
  }, 3000);
})();
</script>
</head>
<body>

<a class="skip" href="#main">跳到内容</a>

<header class="topbar" id="top">
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="inner">
    <a class="mark" href="#top" id="mark">澄江子</a>
    <nav aria-label="页面导航">
      <a href="#works">作品</a>
      <a href="#skills">技能</a>
    </nav>
  </div>
</header>

  <svg class="scribble" id="scribble" aria-hidden="true" viewBox="0 0 12 1000" preserveAspectRatio="none">
    <path id="scribble-path" d="M6 0 C 2.5 130, 9.5 250, 6 370 S 2.5 620, 6 740 S 9.5 900, 6 1000"/>
    <circle id="scribble-bead" r="3"></circle>
  </svg>

<main id="main" tabindex="-1">

  <section class="cover">
    <div class="inner">
      <p class="kicker" id="kicker" data-reveal="up"></p>
      <h1 class="display" id="display" data-reveal-text style="--rv-delay:.08s"><span id="display-t"></span></h1>
      <p class="lede" id="lede" data-reveal="up" style="--rv-delay:.26s"></p>
      <div class="acts" id="acts" data-reveal="up" style="--rv-delay:.36s"></div>
      <div class="facts ln" id="facts" data-reveal-children="up" data-delay="540"></div>
    </div>
  </section>

  <section class="sec" id="works">
    <div class="inner">
      <div class="sec-head" data-reveal-children="up"><span class="num">01</span><h2>作品</h2></div>
      <ul class="toc ln ink" id="toc" data-reveal-children="up" data-delay="180"></ul>
    </div>
  </section>

  <div id="cases"></div>

  <section class="sec" id="skills">
    <div class="inner">
      <div class="sec-head" data-reveal-children="up"><span class="num">02</span><h2>技能</h2></div>
      <div class="notes ln" id="skills-box" data-reveal-children="up" data-delay="120"></div>
    </div>
  </section>

  <section class="sec pad" id="pad">
    <div class="inner">
      <div class="sec-head" data-reveal-children="up"><span class="num">03</span><h2>试笔</h2></div>
      <div class="inkpad" id="inkpad"></div>
    </div>
  </section>

</main>

<footer>
  <div class="inner">
    <div class="foot" data-reveal="up">
      <span class="fsig"><span class="fmark" aria-hidden="true">澄</span><span class="fname" id="fname"></span></span>
      <span id="flinks"></span>
    </div>
  </div>
</footer>

<noscript>
  <div class="inner"><p class="lede">这部分内容要浏览器开着脚本才会显示，开一下再刷新。</p></div>
</noscript>

<script src="works.js"></script>
<script>
(function () {
  if (typeof PROFILE === "undefined" || typeof WORKS === "undefined") {
    var m = document.getElementById("main");
    if (m) m.innerHTML = '<div class="inner"><p class="lede">内容没加载出来，刷新一下试试。' +
      '一直这样就直接看 <a href="https://github.com/chengjiang-zi">GitHub</a>。</p></div>';
    document.documentElement.classList.remove("booting");
    return;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function ext(u) { return String(u || "").indexOf("http") === 0; }
  function dly(t) { return ' style="--rv-delay:' + t + '"'; }

  var calm = false, touch = false;

  function facts() {
    var h = "";
    for (var i = 0; i < STATS.length; i++) {
      h += "<div><span class=\"nmask\"><span class=\"n\" data-n=\"" + esc(STATS[i].v) + "\">" + esc(STATS[i].v) + "</span></span>" +
           "<span class=\"l\">" + esc(STATS[i].l) + "</span></div>";
    }
    return h;
  }

  function toc() {
    var h = "";
    for (var i = 0; i < WORKS.length; i++) {
      var w = WORKS[i];
      h += '<li><a href="#' + esc(w.id) + '">' +
           '<span class="no">' + pad(i + 1) + "</span>" +
           '<span class="title">' + esc(w.title) + "</span>" +
           '<span class="lead" aria-hidden="true"></span>' +
           '<span class="kind">' + esc(w.type || "") + "</span>" +
           '<span class="year">' + esc(w.year || "") + "</span>" +
           "</a></li>";
    }
    return h;
  }

  function shots(w) {
    var list = w.shots || [];
    if (!list.length) return "";

    var land = 0, port = 0, j, lo = 0, hi = 0, ar = 0;
    for (j = 0; j < list.length; j++) {
      var q = list[j];
      if (!q.w || !q.h) continue;
      if (q.w > q.h) land++; else port++;
      var a = q.w / q.h;
      if (!ar || a < ar) ar = a;
      if (!hi || a > hi) hi = a;
    }
    var n = list.length, cols = 1;
    if (land === n) cols = n === 1 ? 1 : 2;
    else if (port === n) cols = n >= 3 ? 3 : n;

    if (!ar) ar = 1.7778;
    var uniform = !hi || (hi / ar) < 1.1;

    var h = '<div class="shots c' + cols + '"' +
            (uniform ? ' style="--ar:' + ar.toFixed(4) + '"' : "") +
            ' data-reveal-children="fade" data-delay="150">';
    for (var i = 0; i < n; i++) {
      var s = list[i];
      var fl = uniform ? "" : ' style="--ar:' + (s.w && s.h ? (s.w / s.h).toFixed(4) : "1.7778") + '"';
      h += "<figure" + fl + '>' +
           '<span class="frame"><img src="' + esc(s.src) + '" alt="' + esc(w.title) +
           (s.caption ? " · " + esc(s.caption) : "") + '"' +
           (s.w && s.h ? ' width="' + s.w + '" height="' + s.h + '"' : "") +
           ' loading="lazy" decoding="async"></span>';
      if (s.caption) h += "<figcaption>" + esc(s.caption) + "</figcaption>";
      h += "</figure>";
    }
    return h + "</div>";
  }

  function caseHtml(w, i) {
    var has = (w.shots || []).length;
    var alt = (has && i % 2 === 1) ? " alt" : "";
    var bare = has ? "" : " bare";
    var h = '<section class="showcase' + alt + bare + '" id="' + esc(w.id) + '"><div class="inner">';

    h += '<div class="work-head lnb" data-reveal="up"><div class="work-title">';
    h += '<span class="wnum">' + pad(i + 1) + "</span>";
    h += "<h3>" + esc(w.title) + "</h3>";
    h += '<span class="sub">' + esc(w.type || "") + "</span>";
    h += "</div>";

    h += '<div class="work-role">';
    if (w.badge) h += '<span class="wbadge">' + esc(w.badge) + "</span> ";
    if (w.role) h += "<b>" + esc(w.role) + "</b>" + esc(w.roleNote || "");
    h += "</div></div>";

    if (w.desc) h += '<p class="work-lede" data-reveal="up"' + dly(".12s") + ">" + esc(w.desc) + "</p>";
    h += shots(w);

    var tg = w.tags || [], lk = w.links || [];
    if (tg.length || lk.length || w.note) {
      h += '<div class="wfoot" data-reveal="up"' + dly(".18s") + "><div>";
      if (tg.length) {
        h += '<div class="wtags">';
        for (var k = 0; k < tg.length; k++) h += "<span>" + esc(tg[k]) + "</span>";
        h += "</div>";
      }
      if (w.note) h += '<p class="wnote">' + esc(w.note) + "</p>";
      h += "</div>";
      if (lk.length) {
        h += '<a class="wlink" href="' + esc(lk[0].url) + '"' +
             (ext(lk[0].url) ? ' target="_blank" rel="noopener"' : "") + ">" +
             esc(lk[0].label) + "</a>";
      }
      h += "</div>";
    }

    return h + "</div></section>";
  }

  function cases() {
    var h = "", open = false;
    for (var i = 0; i < WORKS.length; i++) {
      var bare = !(WORKS[i].shots || []).length;
      if (bare && !open) { h += '<div class="pair"><div class="pair-in">'; open = true; }
      else if (!bare && open) { h += "</div></div>"; open = false; }
      h += caseHtml(WORKS[i], i);
    }
    return open ? h + "</div></div>" : h;
  }

  function notes(list) {
    var h = "";
    for (var i = 0; i < list.length; i++) {
      h += "<article><h3>" + esc(list[i].t) + "</h3><ul>";
      for (var j = 0; j < list[i].items.length; j++) {
        h += "<li>" + esc(list[i].items[j]) + "</li>";
      }
      h += "</ul></article>";
    }
    return h;
  }

  function render() {
    var p = PROFILE;
    try {
      calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      touch = matchMedia("(hover: none)").matches;
    } catch (e) {}
    document.getElementById("mark").textContent = p.name;
    document.getElementById("fname").textContent = p.name;
    document.getElementById("kicker").textContent = p.kicker || "";
    var dt = document.getElementById("display-t");
    dt.textContent = "";
    var dstr = p.display || "";
    for (var ci = 0; ci < dstr.length; ci++) {
      var sp = document.createElement("span");
      sp.className = "cw";
      sp.textContent = dstr.charAt(ci);
      sp.style.setProperty("--rv-delay", (ci * 0.045).toFixed(3) + "s");
      dt.appendChild(sp);
    }
    document.getElementById("lede").textContent = p.lede || "";

    var ls = (p.links || []).slice();
    if (p.contact) ls.push({ label: p.contact, url: "mailto:" + p.contact });

    var ah = "";
    for (var i = 0; i < ls.length; i++) {
      ah += '<a href="' + esc(ls[i].url) + '"' +
            (ext(ls[i].url) ? ' target="_blank" rel="noopener"' : "") + ">" + esc(ls[i].label) + "</a>";
    }
    document.getElementById("acts").innerHTML = ah;
    document.getElementById("flinks").innerHTML = ah;

    document.getElementById("facts").innerHTML = facts();
    document.getElementById("toc").innerHTML = toc();
    document.getElementById("cases").innerHTML = cases();
    document.getElementById("skills-box").innerHTML = notes(SKILLS);

    reveal();
    scrollFx();
    magnet();
  }

  function countUp(el) {
    var t = parseInt(el.getAttribute("data-n"), 10);
    if (isNaN(t)) return;
    if (calm) { el.textContent = el.getAttribute("data-n"); return; }
    var dur = 1150, t0 = null;
    function step(ts) {
      if (t0 === null) t0 = ts;
      var k = Math.min(1, (ts - t0) / dur);
      var e = 1 - Math.pow(1 - k, 3);
      el.textContent = Math.round(t * e);
      if (k < 1) requestAnimationFrame(step);
      else el.textContent = el.getAttribute("data-n");
    }
    el.textContent = "0";
    requestAnimationFrame(step);
  }

  function magnet() {
    if (touch || calm) return;
    var els = [document.querySelector(".mark"), document.querySelector(".fmark")];
    for (var mi = 0; mi < els.length; mi++) {
      var el = els[mi];
      if (!el) continue;
      (function (el) {
        var radius = 130, strength = 0.3;
        document.addEventListener("pointermove", function (e) {
          var r = el.getBoundingClientRect();
          var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          var dx = e.clientX - cx, dy = e.clientY - cy;
          var dist = Math.sqrt(dx * dx + dy * dy);
          el.style.transform = dist < radius
            ? "translate(" + (dx * strength).toFixed(1) + "px," + (dy * strength).toFixed(1) + "px)"
            : "";
        }, { passive: true });
      })(el);
    }
  }

  function reveal() {
    var list = document.querySelectorAll("[data-reveal],[data-reveal-text],[data-reveal-children],.ln,.lnb,.showcase.alt");
    var nodes = [], i;
    for (i = 0; i < list.length; i++) nodes.push(list[i]);

    var on = document.documentElement.classList.contains("motion-ready") &&
             (typeof IntersectionObserver === "function");

    if (!on) {
      for (i = 0; i < nodes.length; i++) nodes[i].classList.add("is-revealed");
      return;
    }

    function hit(el) {
      var kids = el.hasAttribute("data-reveal-children") ? el.children : null;
      if (kids && kids.length) {
        var base = parseInt(el.getAttribute("data-delay") || "60", 10);
        for (var k = 0; k < kids.length; k++) {
          kids[k].style.setProperty("--rv-delay", (base + k * 85) + "ms");
          kids[k].classList.add("is-revealed");
        }
      }
      if (el.id === "facts") {
        var fns = el.querySelectorAll(".n");
        for (var fi = 0; fi < fns.length; fi++) countUp(fns[fi]);
      }
      el.classList.add("is-revealed");
    }

    var io = null;
    try {
      io = new IntersectionObserver(function (entries) {
        for (var n = 0; n < entries.length; n++) {
          if (!entries[n].isIntersecting) continue;
          hit(entries[n].target);
          io.unobserve(entries[n].target);
        }
      }, { rootMargin: "0px 0px -6% 0px", threshold: .06 });
    } catch (e) {
      document.documentElement.classList.remove("motion-ready");
      for (i = 0; i < nodes.length; i++) nodes[i].classList.add("is-revealed");
      return;
    }

    for (i = 0; i < nodes.length; i++) io.observe(nodes[i]);
  }

  function scrollFx() {
    var bar = document.getElementById("progress");
    var bar_el = document.querySelector(".topbar");
    var scrib = document.getElementById("scribble-path");
    var bead = document.getElementById("scribble-bead");
    var scLen = 0;
    if (scrib) {
      try { scLen = scrib.getTotalLength(); scrib.style.strokeDasharray = scLen; } catch (e) {}
    }
    var waiting = false;

    function update() {
      waiting = false;
      var max = document.documentElement.scrollHeight - window.innerHeight;
      var y = window.pageYOffset || document.documentElement.scrollTop || 0;
      var p = max > 0 ? Math.min(1, Math.max(0, y / max)) : 0;
      if (bar) {
        bar.style.transform = "scaleX(" + p + ")";
        bar.classList.toggle("on", p > .012);
      }
      if (bar_el) bar_el.classList.toggle("scrolled", y > 8);
      if (scrib && scLen) {
        if (calm) {
          scrib.style.strokeDashoffset = "0";
          if (bead) bead.style.display = "none";
        } else {
          scrib.style.strokeDashoffset = (scLen * (1 - p)).toFixed(1);
          if (bead) {
            try {
              var pt = scrib.getPointAtLength(scLen * p);
              bead.setAttribute("cx", pt.x);
              bead.setAttribute("cy", pt.y);
              bead.style.display = "";
            } catch (e) {}
          }
        }
      }
    }
    function onScroll() {
      if (waiting) return;
      waiting = true;
      requestAnimationFrame(update);
    }
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll, { passive: true });
  }

  render();
  document.documentElement.classList.remove("booting");
})();
</script>

</body>
</html>
